<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arquivo grande demais</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 2rem; }
    main { max-width: 40rem; margin: 4rem auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem 1.75rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
    p { line-height: 1.5; margin: 0 0 1rem; color: #334155; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1>Arquivo excede o limite de envio</h1>
    <p>O Forn_cli e os demais arquivos de importação podem ter até <strong>1 GB</strong>. Se o envio falhou, volte e tente novamente. Se o arquivo for maior que isso, divida-o antes de importar.</p>
    <p><a href="/importacao/">Voltar para a importação</a></p>
  </main>
</body>
</html>
